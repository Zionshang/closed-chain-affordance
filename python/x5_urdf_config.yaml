# URDF config for building the xArm X5 robot description from assets/robot/x5/urdf/x5.urdf
ref_frame:
  - name: link0

kinematic_chain:
  - base_joint_name: joint1
    end_joint_name: joint6

end_effector:
  - frame_name: ee_link
    gripper_joint_name: joint7

tool:
  - name: tcp
    offset_from_ee_frame: [0.0, 0.0, 0.0]
