[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-chain-affordance"
version = "0.1.0"
description = "Pure-Python implementation of the Closed-Chain Affordance planning framework"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viewer = [
    "meshcat",
    "pin",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["closed_chain_affordance*"]

[tool.setuptools.package-data]
closed_chain_affordance = ["py.typed", "*.pyi"]
