[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cca-planner"
version = "0.2.0"
description = "Torch-native batched Closed-Chain Affordance trajectory planner"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "torch>=2.5",
]

[project.optional-dependencies]
viewer = [
    "numpy>=1.23",
    "scipy>=1.10",
    "viser",
    "yourdfpy",
    "trimesh",
]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cca_planner = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
